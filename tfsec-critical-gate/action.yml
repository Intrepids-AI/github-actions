# Composite: fail PRs on NEW tfsec CRITICAL findings (SEC-33 / SEC-63).
# Usage (caller owns checkout):
#   - uses: Intrepids-AI/github-actions/tfsec-critical-gate@main
#     with:
#       working_directory: terraform
#
# Optional committed baseline at <working_directory>/.tfsec/critical-baseline.json
# (or repo-root .tfsec/critical-baseline.json) allows known CRITICAL debt while
# still blocking fingerprints not listed in the baseline.

name: "tfsec CRITICAL gate"
description: >-
  Run tfsec at CRITICAL severity and fail on any finding not covered by an
  optional critical-baseline.json (blocks new CRITICAL IaC issues).
author: "Intrepids"

inputs:
  working_directory:
    description: Directory to scan (repo-relative).
    required: false
    default: "."
  tfsec_version:
    description: tfsec release tag (e.g. v1.28.14).
    required: false
    default: "v1.28.14"
  baseline_path:
    description: >-
      Path to baseline JSON relative to the repo root. Empty uses
      <working_directory>/.tfsec/critical-baseline.json then
      .tfsec/critical-baseline.json.
    required: false
    default: ""
  additional_args:
    description: Extra args passed to tfsec (space-separated).
    required: false
    default: "--force-all-dirs --exclude-downloaded-modules --ignore-hcl-errors"

runs:
  using: composite
  steps:
    - name: Install tfsec
      shell: bash
      run: |
        set -euo pipefail
        VER="${{ inputs.tfsec_version }}"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64|amd64) ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
          *) echo "Unsupported arch: $ARCH"; exit 1 ;;
        esac
        URL="https://github.com/aquasecurity/tfsec/releases/download/${VER}/tfsec-linux-${ARCH}"
        curl -fsSL -o "${RUNNER_TEMP}/tfsec" "$URL"
        chmod +x "${RUNNER_TEMP}/tfsec"
        "${RUNNER_TEMP}/tfsec" --version

    - name: Resolve baseline path
      id: baseline
      shell: bash
      run: |
        set -euo pipefail
        WD="${{ inputs.working_directory }}"
        EXPLICIT="${{ inputs.baseline_path }}"
        if [[ -n "$EXPLICIT" ]]; then
          echo "path=${EXPLICIT}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ -f "${WD}/.tfsec/critical-baseline.json" ]]; then
          echo "path=${WD}/.tfsec/critical-baseline.json" >> "$GITHUB_OUTPUT"
        elif [[ -f ".tfsec/critical-baseline.json" ]]; then
          echo "path=.tfsec/critical-baseline.json" >> "$GITHUB_OUTPUT"
        else
          echo "path=" >> "$GITHUB_OUTPUT"
        fi

    - name: Run tfsec (CRITICAL)
      shell: bash
      run: |
        set -euo pipefail
        WD="${{ inputs.working_directory }}"
        # soft-fail so we always get JSON; gate.py decides exit code
        # shellcheck disable=SC2086
        "${RUNNER_TEMP}/tfsec" "$WD" \
          --minimum-severity CRITICAL \
          --soft-fail \
          ${{ inputs.additional_args }} \
          -f json \
          -o "${RUNNER_TEMP}/tfsec-critical.json"
        # Human-readable summary in logs
        # shellcheck disable=SC2086
        "${RUNNER_TEMP}/tfsec" "$WD" \
          --minimum-severity CRITICAL \
          --soft-fail \
          ${{ inputs.additional_args }} || true
        echo "### tfsec CRITICAL" >> "$GITHUB_STEP_SUMMARY"
        if [[ -n "${{ steps.baseline.outputs.path }}" ]]; then
          echo "Baseline: \`${{ steps.baseline.outputs.path }}\`" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Baseline: _(none — any CRITICAL fails)_" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Gate on new CRITICAL findings
      shell: bash
      run: |
        set -euo pipefail
        ARGS=(
          --results "${RUNNER_TEMP}/tfsec-critical.json"
          --repo-root "${GITHUB_WORKSPACE}"
        )
        BASE="${{ steps.baseline.outputs.path }}"
        if [[ -n "$BASE" ]]; then
          ARGS+=(--baseline "$BASE")
        fi
        python3 "${{ github.action_path }}/gate.py" "${ARGS[@]}"
